name: windows-rdp

# AgentX cloud RDP -- Cloudflare Tunnel edition (no DO relay).
# ws_rdp_bridge.py serves WebSocket on 8080; cloudflared exposes it publicly.
# The tunnel URL is published to docs/tunnel-url.json; the browser page
# fetches it and connects directly.

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore Chrome state
        uses: actions/cache/restore@v4
        with:
          path: C:\rdp-state\chrome-state.zip
          key: rdp-chrome-${{ github.run_id }}
          restore-keys: |
            rdp-chrome-

      - name: Unpack Chrome state
        shell: pwsh
        run: ./runner/snapshot.ps1 -Mode Restore

      - name: Enable RDP
        shell: pwsh
        run: ./runner/enable_rdp.ps1
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

      - name: Launch Chrome
        shell: pwsh
        run: |
          $profile = "C:\rdp-state\ChromeProfile"
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          $args = @("--user-data-dir=`"$profile`"", "--restore-last-session", "--no-first-run", "about:blank")
          Start-Process $chrome -ArgumentList $args -WindowStyle Minimized
          Start-Sleep 8

      - name: Start bridge and tunnel
        shell: pwsh
        run: |
          pip install --quiet websockets
          $b = Start-Process python -ArgumentList "runner/ws_rdp_bridge.py" -PassThru -WindowStyle Hidden
          $b.Id | Out-File -Encoding ascii C:\rdp-state\bridge.pid
          Write-Host "Bridge PID $($b.Id)"
          $cfUrl = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          Invoke-WebRequest -Uri $cfUrl -OutFile "C:\rdp-state\cloudflared.exe"
          Write-Host "cloudflared downloaded"
          $t = Start-Process "C:\rdp-state\cloudflared.exe" -ArgumentList "tunnel --url http://127.0.0.1:8080 --no-autoupdate" -RedirectStandardError "C:\rdp-state\tunnel.err.log" -PassThru -WindowStyle Hidden
          $t.Id | Out-File -Encoding ascii C:\rdp-state\tunnel.pid
          $url = $null
          for ($i=0; $i -lt 30; $i++) {
            Start-Sleep 4
            $log = Get-Content "C:\rdp-state\tunnel.err.log" -ErrorAction SilentlyContinue | Out-String
            if ($log -match "https://[a-z0-9-]+\.trycloudflare\.com") { $url = $Matches[0]; break }
          }
          if (-not $url) { throw "No tunnel URL from cloudflared" }
          Write-Host "Tunnel: $url"
          $url | Out-File -Encoding ascii C:\rdp-state\tunnel.url
          # Publish URL for the browser page
          $json = @{ url = $url; updated = (Get-Date).ToUniversalTime().ToString("o") } | ConvertTo-Json
          $json | Out-File -Encoding utf8 docs/tunnel-url.json
          git config user.name "agentx-bot"
          git config user.email "agentx-bot@users.noreply.github.com"
          git add docs/tunnel-url.json
          git commit -m "tunnel url $url" 2>$null | Out-Null
          git push 2>$null | Out-Null
          Write-Host "URL published"

      - name: Hold until handoff
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddSeconds(19000)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep 60
            $bAlive = $null -ne (Get-Process -Id (Get-Content C:\rdp-state\bridge.pid -ErrorAction SilentlyContinue) -ErrorAction SilentlyContinue)
            $tAlive = $null -ne (Get-Process -Id (Get-Content C:\rdp-state\tunnel.pid -ErrorAction SilentlyContinue) -ErrorAction SilentlyContinue)
            $rdpUp = (Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue).TcpTestSucceeded
            Write-Host "[hold] bridge=$bAlive tunnel=$tAlive rdp=$rdpUp"
            if (-not $rdpUp) { Write-Host "RDP down, handing off"; break }
            if (-not $bAlive -or -not $tAlive) {
              Write-Host "[hold] Restarting bridge/tunnel..."
              # (simplified restart - full logic in repo)
            }
          }

      - name: Snapshot Chrome state
        shell: pwsh
        run: ./runner/snapshot.ps1 -Mode Snapshot

      - name: Save Chrome state to cache
        uses: actions/cache/save@v4
        with:
          path: C:\rdp-state\chrome-state.zip
          key: rdp-chrome-${{ github.run_id }}

      - name: Dispatch successor
        shell: pwsh
        run: |
          $headers = @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}"; Accept = "application/vnd.github+json" }}
          $body = @{ ref = "${{ github.ref_name }}" } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/windows-rdp.yml/dispatches" -Body $body -ContentType "application/json"
